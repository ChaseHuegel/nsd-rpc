name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Pin the nsdc compiler. Bump together with the needlefish release.
  NSDC_VERSION: 1.3.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install nsdc
        run: |
          curl -fsSL -o /tmp/nsdc.zip "https://github.com/ChaseHuegel/needlefish/releases/download/v${NSDC_VERSION}/nsdc_linux.zip"
          unzip -o /tmp/nsdc.zip -d /tmp/nsdc
          chmod +x /tmp/nsdc/nsdc
          echo "/tmp/nsdc" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore
