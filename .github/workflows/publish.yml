name: publish

# Publishing runs only on version tags. Bump the Version property in
# NsdRpc/NsdRpc.csproj before tagging, then tag like: v0.1.0
on:
  push:
    tags: [ "v*" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test

      - name: Pack
        run: |
          dotnet pack NsdRpc/NsdRpc.csproj --configuration Release -o ./.packages/
          dotnet pack NsdRpc.Tcp/NsdRpc.Tcp.csproj --configuration Release -o ./.packages/
          dotnet pack NsdRpc.Generators/NsdRpc.Generators.csproj --configuration Release -o ./.packages/

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          # The nuget.org profile name, not the email address.
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          for package in ./.packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json
          done
